# Nginx config for sandbox.zenrex.ai — sandbox preview subdomain.
#
# Routes /p/{pid}/{path...} → /opt/zerax/sandboxes/{pid}/repo/{path...}
# Read-only static file serving with strict auth via signed cookie.
#
# Deployment:
#   1. Add DNS A record: sandbox.zenrex.ai → 91.98.154.148
#   2. Copy this file to /etc/nginx/sites-enabled/sandbox.zenrex.ai
#   3. Issue cert: certbot certonly --nginx -d sandbox.zenrex.ai
#   4. Reload: nginx -t && systemctl reload nginx
#
# Or use wildcard cert: certbot certonly -d "*.zenrex.ai" -d zenrex.ai --manual --preferred-challenges dns

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sandbox.zenrex.ai;

    # SSL — adjust paths to your cert
    ssl_certificate     /etc/letsencrypt/live/sandbox.zenrex.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.zenrex.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers — sandboxed preview, no JS execution from foreign origins.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self';" always;

    client_max_body_size 5m;
    proxy_read_timeout 60s;

    # Auth gateway — every /p/{pid}/* request first hits the backend
    # which validates the user's JWT + project ownership before allowing
    # nginx to serve the static file.
    location ~ ^/p/([a-f0-9\-]+)/(.*)$ {
        set $pid $1;
        set $relpath $2;

        # Auth subrequest — backend returns 200 (allow) or 401/403 (deny).
        auth_request /__auth__;
        auth_request_set $auth_uid $upstream_http_x_user_id;

        # Map to the sandbox dir on disk.
        alias /opt/zerax/sandboxes/$pid/repo/$relpath;

        # Default index for directory listings
        index index.html index.htm;
        autoindex off;

        # Block dotfiles + executables for safety
        location ~ /\.(git|env|ssh|aws) { return 403; }
        location ~ \.(sh|exe|bat|py|php)$ { return 403; }
    }

    # Internal auth subrequest endpoint — calls the backend's preview-auth
    # check. It MUST receive the JWT via a cookie that the main app sets when
    # the customer clicks "open preview" in the chat.
    location = /__auth__ {
        internal;
        proxy_pass http://127.0.0.1:8001/api/freebuild-chat/continuation/sandbox/preview-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name sandbox.zenrex.ai;
    return 301 https://$host$request_uri;
}
