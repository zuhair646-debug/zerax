server {
    server_name zenrex.ai www.zenrex.ai _;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(self)" always;
    client_max_body_size 100M;
    root /opt/zerax/frontend/build;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/ttf font/otf application/font-woff;
    gzip_min_length 1024;


    # SSE streaming endpoints — MUST disable buffering & gzip for live events
    location ~ ^/api/(.+/(stream|agent-chat-stream).*|freebuild-chat/.+/agent-chat-stream)$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

        # ===== Zenrex Play PWA (subpath /play) =====
    location = /play/manifest.webmanifest {
        alias /var/www/pwa_play/manifest.webmanifest;
        types { } default_type "application/manifest+json";
        add_header Cache-Control "no-cache";
    }
    location = /play/sw.js {
        alias /var/www/pwa_play/sw.js;
        types { } default_type "application/javascript";
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/play";
    }
    location = /play/app.js {
        alias /var/www/pwa_play/app.js;
        types { } default_type "application/javascript";
        add_header Cache-Control "no-cache";
    }
    location = /play/icon-192.png { alias /var/www/pwa_play/icon-192.png; add_header Cache-Control "public, max-age=86400"; }
    location = /play/icon-512.png { alias /var/www/pwa_play/icon-512.png; add_header Cache-Control "public, max-age=86400"; }
    location = /play {
        alias /var/www/pwa_play/index.html;
        types { } default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location = /play/ { return 301 /play; }

    # Old /kids URL → redirect to /play (legacy users)
    location = /kids { return 301 /play; }
    location = /kids/ { return 301 /play; }
    location = /kids/reset { return 301 /play; }

    # Published FreeBuild sites — clean URL: /s/{slug}
    # Multi-page support: /s/{slug}/{filename}.html
    location ~ ^/s/([a-z0-9][a-z0-9-]+[a-z0-9])/([a-z0-9][a-z0-9_-]*\.html)$ {
        proxy_pass http://127.0.0.1:8001/api/freebuild-chat/published-sites/$1/$2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        add_header Cache-Control "public, max-age=60";
    }
    location ~ ^/s/([a-z0-9][a-z0-9-]+[a-z0-9])$ {
        proxy_pass http://127.0.0.1:8001/api/freebuild-chat/published-sites/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        # Cache published HTML for 60s at the edge — fast loads, still semi-fresh
        add_header Cache-Control "public, max-age=60";
    }

    # WebSocket endpoints (desktop-agent, livekit etc) — needs HTTP/1.1 + Upgrade headers
    location ~ ^/api/(desktop-agent/ws|local-browser/ws|.*/ws($|/)) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }


    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }
    location ^~ /static/uploads/ {
        alias /opt/zerax/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Mockup JS/CSS/HTML must NEVER cache aggressively (they change often)
    location ~* ^/mockups/.+\.(js|css|html)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    # Mockup images/fonts can cache 7 days
    location ~* ^/mockups/.+\.(png|jpg|jpeg|gif|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location /mockups/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    # Google OAuth callback: nginx rewrites the user-friendly
    # URL (registered in Google Cloud Console) to our internal API endpoint.
    location = /auth/google {
        return 302 /api/auth/google/callback$is_args$args;
    }

    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zenrex.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zenrex.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.zenrex.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zenrex.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name zenrex.ai www.zenrex.ai _;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(self)" always;
    return 404; # managed by Certbot




}
